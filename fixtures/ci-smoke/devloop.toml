root = "."
debounce_ms = 100
state_file = "./.devloop/state.json"
startup_workflows = ["startup"]

[watch.content]
paths = ["watched.txt"]
workflow = "content"

[process.server]
command = ["./scripts/emit-ready.sh"]
cwd = "."
autostart = false
restart = "always"
output = { inherit = true, rules = [{ state_key = "server_ready", pattern = "^(ready)$", extract = "regex" }] }

[process.server.readiness]
kind = "state_key"
key = "server_ready"
interval_ms = 100
timeout_ms = 5000

[hook.current_value]
command = ["./scripts/read-watched.sh"]
cwd = "."
capture = "text"
state_key = "current_value"
output = { inherit = false }

[workflow.startup]
steps = [
  { action = "start_process", process = "server" },
  { action = "wait_for_process", process = "server" },
  { action = "run_hook", hook = "current_value" },
  { action = "log", message = "startup value: {{current_value}}" },
]

[workflow.content]
steps = [
  { action = "run_hook", hook = "current_value" },
  { action = "write_state", key = "current_url", value = "devloop://{{current_value}}" },
  { action = "log", message = "changed value: {{current_value}}" },
]
